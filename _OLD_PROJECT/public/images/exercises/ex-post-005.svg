<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="#F9FAFB" stroke="#10B981" stroke-width="2" rx="8"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad24" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#grad24)" rx="8"/>
  
  <!-- Main icon -->
  <text x="150" y="80" text-anchor="middle" font-size="48" font-family="Arial, sans-serif">💪</text>
  
  <!-- Exercise name -->
  <text x="150" y="110" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial, sans-serif" fill="#1F2937">
    Fortalecimento Progressivo
  </text>
  
  <!-- Specialty badge -->
  <rect x="50" y="130" width="200" height="20" fill="#10B981" rx="10"/>
  <text x="150" y="143" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial, sans-serif" fill="white">
    Pós-operatória
  </text>
  
  <!-- Difficulty level -->
  <text x="150" y="165" text-anchor="middle" font-size="11" font-family="Arial, sans-serif" fill="#6B7280">
    Nível 2
  </text>
  
  <!-- Duration -->
  <text x="150" y="180" text-anchor="middle" font-size="10" font-family="Arial, sans-serif" fill="#9CA3AF">
    5:00
  </text>
</svg>