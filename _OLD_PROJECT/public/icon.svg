<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#0ea5e9" rx="64"/>

  <!-- Stethoscope Icon (Healthcare Symbol) -->
  <g transform="translate(128, 128)">
    <!-- Main Circle -->
    <circle cx="128" cy="200" r="40" fill="white" stroke="white" stroke-width="8"/>

    <!-- Left Tube -->
    <path d="M 128 160 Q 80 120, 60 80" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <circle cx="60" cy="80" r="20" fill="white"/>
    <circle cx="60" cy="80" r="12" fill="#0ea5e9"/>

    <!-- Right Tube -->
    <path d="M 128 160 Q 176 120, 196 80" fill="none" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <circle cx="196" cy="80" r="20" fill="white"/>
    <circle cx="196" cy="80" r="12" fill="#0ea5e9"/>

    <!-- Center Detail -->
    <circle cx="128" cy="200" r="25" fill="#0ea5e9" stroke="white" stroke-width="4"/>

    <!-- AI Sparkle -->
    <g transform="translate(220, 60)">
      <path d="M 0 -15 L 2 -2 L 15 0 L 2 2 L 0 15 L -2 2 L -15 0 L -2 -2 Z" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Text Label -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">
    DuduFisio
  </text>
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#e0f2fe">
    AI
  </text>
</svg>
