name: Validate Environment Variables

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  validate-env:
    name: Validate Environment Variables
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate .env.example structure
        run: |
          echo "🔍 Validando estrutura do .env.example..."
          
          # Verificar se .env.example existe
          if [ ! -f .env.example ]; then
            echo "❌ Arquivo .env.example não encontrado!"
            exit 1
          fi
          
          # Verificar variáveis obrigatórias
          echo "📋 Verificando variáveis obrigatórias..."
          
          REQUIRED_VARS=(
            "VITE_SUPABASE_URL"
            "VITE_SUPABASE_ANON_KEY"
          )
          
          MISSING_VARS=()
          
          for var in "${REQUIRED_VARS[@]}"; do
            if ! grep -q "^${var}=" .env.example; then
              MISSING_VARS+=("$var")
            fi
          done
          
          if [ ${#MISSING_VARS[@]} -ne 0 ]; then
            echo "❌ Variáveis obrigatórias faltando em .env.example:"
            printf '   - %s\n' "${MISSING_VARS[@]}"
            exit 1
          fi
          
          echo "✅ Todas as variáveis obrigatórias estão presentes"
      
      - name: Check for secrets in .env.example
        run: |
          echo "🔒 Verificando se há segredos em .env.example..."
          
          SENSITIVE_VARS=(
            "VITE_SUPABASE_ANON_KEY"
            "VITE_SUPABASE_SERVICE_ROLE_KEY"
            "VITE_GEMINI_API_KEY"
          )
          
          HAS_SECRETS=false
          
          for var in "${SENSITIVE_VARS[@]}"; do
            # Verificar se a variável tem um valor real (não placeholder)
            VALUE=$(grep "^${var}=" .env.example | cut -d'=' -f2)
            
            if [ -n "$VALUE" ] && [ "$VALUE" != "your_${var,,}" ] && [ "$VALUE" != "example" ]; then
              # Verificar se é um JWT ou chave longa (provavelmente um segredo real)
              if echo "$VALUE" | grep -q "eyJ" || [ ${#VALUE} -gt 50 ]; then
                echo "⚠️  Possível segredo encontrado em .env.example: $var"
                echo "   Certifique-se de usar placeholders como 'your_key_here'"
                HAS_SECRETS=true
              fi
            fi
          done
          
          if [ "$HAS_SECRETS" = true ]; then
            echo "❌ .env.example pode conter segredos reais!"
            echo "   Use placeholders genéricos em vez de valores reais"
            exit 1
          fi
          
          echo "✅ Nenhum segredo real encontrado em .env.example"
      
      - name: Validate .gitignore
        run: |
          echo "📁 Verificando .gitignore..."
          
          if [ ! -f .gitignore ]; then
            echo "❌ Arquivo .gitignore não encontrado!"
            exit 1
          fi
          
          # Verificar se .env.local está no .gitignore
          if ! grep -q "\.env\.local" .gitignore; then
            echo "❌ .env.local não está no .gitignore!"
            echo "   Adicione: .env.local ou .env*.local"
            exit 1
          fi
          
          echo "✅ .gitignore está configurado corretamente"
      
      - name: Test build with mock environment
        run: |
          echo "🏗️  Testando build com variáveis mockadas..."
          
          # Criar .env.test com valores mockados
          cat > .env.test << EOF
          VITE_SUPABASE_URL=https://test-project.supabase.co
          VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test
          VITE_GEMINI_API_KEY=test_key
          EOF
          
          # Tentar build (pode falhar por falta de conexão, mas valida sintaxe)
          npm run build || echo "⚠️  Build falhou (esperado sem conexão real)"
          
          # Limpar
          rm -f .env.test
          
          echo "✅ Build testado com variáveis mockadas"
      
      - name: Generate environment documentation
        run: |
          echo "📚 Gerando documentação de variáveis..."
          
          echo "## Variáveis de Ambiente" > ENV_DOCS.md
          echo "" >> ENV_DOCS.md
          echo "### Obrigatórias" >> ENV_DOCS.md
          echo "" >> ENV_DOCS.md
          grep "^VITE_SUPABASE" .env.example | sed 's/^/  - /' >> ENV_DOCS.md
          echo "" >> ENV_DOCS.md
          echo "### Opcionais" >> ENV_DOCS.md
          echo "" >> ENV_DOCS.md
          grep "^VITE_GEMINI\|^TWILIO\|^SMTP" .env.example | sed 's/^/  - /' >> ENV_DOCS.md
          
          echo "✅ Documentação gerada em ENV_DOCS.md"
      
      - name: Summary
        run: |
          echo "## ✅ Validação Concluída" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Estrutura do .env.example validada" >> $GITHUB_STEP_SUMMARY
          echo "✓ Nenhum segredo encontrado" >> $GITHUB_STEP_SUMMARY
          echo "✓ .gitignore configurado corretamente" >> $GITHUB_STEP_SUMMARY
          echo "✓ Build testado com variáveis mockadas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📚 Consulte TROUBLESHOOTING.md para mais informações" >> $GITHUB_STEP_SUMMARY

