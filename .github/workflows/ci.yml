name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Executar Lint
        run: npm run lint
        continue-on-error: true
      
      - name: Executar Type-Check
        run: npm run type-check
        continue-on-error: true
      
      - name: Executar Testes Unitários
        run: npm run test:unit
        continue-on-error: true
      
      - name: Executar Testes com Cobertura
        run: npm run test:unit:coverage
        continue-on-error: true
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
      
      - name: Build
        run: npm run build
      
      - name: Security Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Auditoria Personalizada
        run: npm run security:audit
        continue-on-error: true
      
      - name: Verificar Dependências Críticas
        run: npm run check:dependencies
        continue-on-error: true
  
  e2e-tests:
    name: Testes E2E
    runs-on: ubuntu-latest
    needs: quality-checks
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      
      - name: Build para preview
        run: npm run build:fast
      
      - name: Start preview server
        run: npm run start &
        env:
          PORT: 4173
      
      - name: Aguardar servidor estar pronto
        run: npx wait-on http://localhost:4173 --timeout 30000
      
      - name: Executar testes críticos de evolução
        run: npm run test:critical
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:4173
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-ci
          path: |
            playwright-report/
            test-results/
          retention-days: 30
  
  testsprite-validation:
    name: TestSprite Validation
    runs-on: ubuntu-latest
    needs: quality-checks
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Validar TestSprite Files
        run: |
          echo "Validando arquivos TestSprite..."
          if [ -d "testsprite_tests" ]; then
            echo "✅ Pasta testsprite_tests encontrada"
            ls -la testsprite_tests/
          else
            echo "❌ Pasta testsprite_tests não encontrada"
            exit 1
          fi
      
      - name: Verificar Test Plan
        run: |
          if [ -f "testsprite_tests/testsprite_frontend_test_plan.json" ]; then
            echo "✅ Test plan encontrado"
            cat testsprite_tests/testsprite_frontend_test_plan.json | head -n 20
          else
            echo "⚠️  Test plan não encontrado"
          fi
  
  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Verificar Documentação Essencial
        run: |
          echo "Verificando documentação..."
          
          # Documentos principais
          for doc in DEVELOPER_GUIDE.md AI_CONTEXT.md BUSINESS_RULES.md API_DOCUMENTATION.md README.md; do
            if [ -f "$doc" ]; then
              echo "✅ $doc encontrado"
            else
              echo "❌ $doc não encontrado"
              exit 1
            fi
          done
          
          echo "✅ Toda documentação essencial está presente"
