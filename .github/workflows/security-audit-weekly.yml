name: Security Audit Weekly

on:
  schedule:
    # Toda segunda-feira às 9h UTC (6h BRT)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Permite execução manual

jobs:
  security-audit:
    name: Auditoria de Segurança Semanal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar auditoria personalizada
        id: audit
        run: |
          node scripts/security-audit.cjs
        continue-on-error: true

      - name: Listar relatórios gerados
        run: ls -la security-audits/

      - name: Obter último relatório
        id: report
        run: |
          LATEST_REPORT=$(ls -t security-audits/audit-*.md | head -1)
          echo "report_file=$LATEST_REPORT" >> $GITHUB_OUTPUT
          
          # Extrair resumo do relatório
          if [ -f "$LATEST_REPORT" ]; then
            echo "## 🔍 Resumo da Auditoria" > audit-summary.md
            echo "" >> audit-summary.md
            head -n 20 "$LATEST_REPORT" >> audit-summary.md
          fi

      - name: Verificar vulnerabilidades críticas
        id: check_critical
        run: |
          LATEST_REPORT=$(ls -t security-audits/audit-*.md | head -1)
          
          if grep -q "CRITICAL Risk Vulnerabilities" "$LATEST_REPORT" || grep -q "HIGH Risk Vulnerabilities" "$LATEST_REPORT"; then
            echo "has_critical=true" >> $GITHUB_OUTPUT
            echo "⚠️ Vulnerabilidades CRITICAL ou HIGH encontradas!"
          else
            echo "has_critical=false" >> $GITHUB_OUTPUT
            echo "✅ Nenhuma vulnerabilidade crítica"
          fi

      - name: Commit relatório no repositório
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add security-audits/
          
          if git diff --staged --quiet; then
            echo "Nenhuma mudança para commitar"
          else
            git commit -m "chore: auditoria de segurança semanal [skip ci]"
            git push
          fi

      - name: Upload relatório como artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audits/audit-*.md
          retention-days: 90

      - name: Criar issue se vulnerabilidades críticas
        if: steps.check_critical.outputs.has_critical == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync('audit-summary.md', 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 Vulnerabilidades Críticas Detectadas',
              body: `${reportContent}\n\n---\n\n**Ação necessária**: Revisar relatório completo e aplicar correções.\n\nRelatório completo: Veja os artifacts do workflow.`,
              labels: ['security', 'high-priority']
            });

      - name: Comentar em PR aberto (se houver)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('audit-summary.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

      - name: Resumo do job
        run: |
          echo "### 🔐 Auditoria de Segurança Concluída" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "audit-summary.md" ]; then
            cat audit-summary.md >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Relatório completo disponível nos artifacts" >> $GITHUB_STEP_SUMMARY

