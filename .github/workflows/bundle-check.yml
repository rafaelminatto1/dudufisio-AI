name: Bundle Size Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  bundle-analysis:
    name: Análise de Bundle Size
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build para produção
        run: npm run build:fast
        env:
          NODE_ENV: production

      - name: Verificar bundle size
        id: bundle_check
        run: |
          node scripts/check-bundle-size.cjs > bundle-report.txt
          cat bundle-report.txt
          
          # Extrair tamanho total
          BUNDLE_SIZE=$(grep -oP '\d+\.\d+MB' bundle-report.txt | head -1 || echo "0MB")
          echo "bundle_size=$BUNDLE_SIZE" >> $GITHUB_OUTPUT
          
          # Verificar se passou
          if grep -q "TODOS OS CHECKS PASSARAM" bundle-report.txt; then
            echo "status=PASS" >> $GITHUB_OUTPUT
          else
            echo "status=FAIL" >> $GITHUB_OUTPUT
          fi

      - name: Gerar relatório detalhado
        run: |
          echo "## 📦 Análise de Bundle Size" > bundle-summary.md
          echo "" >> bundle-summary.md
          echo "**Tamanho Total**: ${{ steps.bundle_check.outputs.bundle_size }}" >> bundle-summary.md
          echo "**Status**: ${{ steps.bundle_check.outputs.status }}" >> bundle-summary.md
          echo "" >> bundle-summary.md
          echo "### Detalhes" >> bundle-summary.md
          echo "\`\`\`" >> bundle-summary.md
          head -n 40 bundle-report.txt >> bundle-summary.md
          echo "\`\`\`" >> bundle-summary.md

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis-report
          path: |
            bundle-report.txt
            bundle-summary.md
          retention-days: 30

      - name: Comentar em PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('bundle-summary.md', 'utf8');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

      - name: Falhar se bundle muito grande
        if: steps.bundle_check.outputs.status == 'FAIL'
        run: |
          echo "❌ Bundle size excedeu os limites!"
          exit 1

      - name: Resumo do job
        if: always()
        run: |
          echo "### 📦 Bundle Size Check" >> $GITHUB_STEP_SUMMARY
          cat bundle-summary.md >> $GITHUB_STEP_SUMMARY

