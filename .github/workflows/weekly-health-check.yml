name: Weekly Supabase Health Check

on:
  # Executar toda segunda-feira às 9h (UTC)
  schedule:
    - cron: '0 9 * * 1'
  
  # Permitir execução manual
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run health check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/monitor-health-log.ts

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Check health score
        id: check-score
        run: |
          if [ -f "logs/latest-health-check.txt" ]; then
            SCORE=$(grep "Score:" logs/latest-health-check.txt | grep -oP '\d+')
            echo "score=$SCORE" >> $GITHUB_OUTPUT
            echo "Health score: $SCORE%"
            
            if [ "$SCORE" -lt 95 ]; then
              echo "warning=true" >> $GITHUB_OUTPUT
              echo "⚠️ Health score below 95%"
            else
              echo "warning=false" >> $GITHUB_OUTPUT
              echo "✅ Health score is healthy"
            fi
          fi

      - name: Create issue if unhealthy
        if: steps.check-score.outputs.warning == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const score = '${{ steps.check-score.outputs.score }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            // Verificar se já existe um issue aberto
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'supabase-health',
            });

            const existingIssue = issues.data.find(issue => 
              issue.title.includes('Supabase Health Alert')
            );

            const body = `## ⚠️ Supabase Health Alert

**Score:** ${score}% (abaixo do limiar de 95%)
**Data:** ${new Date().toISOString()}
**Workflow Run:** ${runUrl}

### Ação Necessária

O monitoramento semanal detectou que o score de saúde do Supabase está abaixo do esperado.

**Próximos passos:**
1. Baixar o relatório completo nos artefatos do workflow
2. Executar: \`npx tsx scripts/revisao-completa.ts\`
3. Investigar problemas identificados
4. Aplicar correções necessárias

### Relatório

Verifique o artefato \`health-report-${context.runNumber}\` para detalhes completos.

---
*Este issue foi criado automaticamente pelo workflow de monitoramento.*
`;

            if (existingIssue) {
              // Adicionar comentário ao issue existente
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## 🔄 Nova Verificação\n\n${body}`
              });
              
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Criar novo issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ Supabase Health Alert - Score: ${score}%`,
                body: body,
                labels: ['supabase-health', 'monitoring', 'priority'],
              });
              
              console.log('Created new health alert issue');
            }

      - name: Add summary
        if: always()
        run: |
          echo "## 📊 Supabase Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "logs/latest-health-check.txt" ]; then
            SCORE=$(grep "Score:" logs/latest-health-check.txt | grep -oP '\d+' || echo "N/A")
            STATUS=$(grep "Status:" logs/latest-health-check.txt | cut -d: -f2 | tr -d ' ' || echo "UNKNOWN")
            
            echo "**Score:** ${SCORE}%" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ${STATUS}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Detalhes" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat logs/latest-health-check.txt >> $GITHUB_STEP_SUMMARY || echo "Erro ao ler relatório"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Não foi possível gerar relatório de saúde" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Supabase Health Check Failed',
              body: `## 🚨 Critical: Health Check Execution Failed

**Data:** ${new Date().toISOString()}
**Workflow Run:** ${runUrl}

O workflow de verificação de saúde do Supabase falhou completamente.

**Ação Imediata Necessária:**
1. Verificar logs do workflow
2. Verificar conectividade com Supabase
3. Verificar se as credenciais (secrets) estão corretas
4. Executar manualmente: \`npx tsx scripts/revisao-completa.ts\`

---
*Este issue foi criado automaticamente pelo workflow de monitoramento.*`,
              labels: ['supabase-health', 'critical', 'bug'],
            });

