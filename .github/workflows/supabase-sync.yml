name: Sync Supabase

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'data/mockData.ts'
      - 'services/**'
      - 'types.ts'

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Supabase CLI
      run: npm install -g supabase
      
    - name: Link to Supabase project
      run: |
        supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        
    - name: Check for pending migrations
      id: check-migrations
      run: |
        # Verifica se há migrations pendentes
        if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
          echo "has-migrations=true" >> $GITHUB_OUTPUT
          echo "📋 Migrations encontradas, aplicando..."
        else
          echo "has-migrations=false" >> $GITHUB_OUTPUT
          echo "✅ Nenhuma migration pendente"
        fi
        
    - name: Apply migrations
      if: steps.check-migrations.outputs.has-migrations == 'true'
      run: |
        echo "🔄 Aplicando migrations..."
        supabase db push
        echo "✅ Migrations aplicadas com sucesso!"
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        
    - name: Seed database (if needed)
      if: steps.check-migrations.outputs.has-migrations == 'true'
      run: |
        if [ -f "supabase/seed.sql" ]; then
          echo "🌱 Executando seed do banco..."
          supabase db seed
          echo "✅ Seed executado com sucesso!"
        fi
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        
    - name: Verify deployment
      run: |
        echo "🔍 Verificando status do deploy..."
        supabase projects list
        echo "✅ Deploy verificado com sucesso!"
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        
    - name: Deployment Summary
      if: always()
      run: |
        echo "## 📊 Resumo do Deploy" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Ações realizadas:**" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Código sincronizado com Supabase" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.check-migrations.outputs.has-migrations }}" == "true" ]; then
          echo "- ✅ Migrations aplicadas" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Seed executado (se disponível)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ℹ️ Nenhuma migration pendente" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Próximos passos:**" >> $GITHUB_STEP_SUMMARY
        echo "- Teste a aplicação em produção" >> $GITHUB_STEP_SUMMARY
        echo "- Verifique se todas as funcionalidades estão funcionando" >> $GITHUB_STEP_SUMMARY
