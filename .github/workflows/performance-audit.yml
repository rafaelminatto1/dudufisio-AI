name: Performance Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production
        run: npm run build:fast
        env:
          NODE_ENV: production
      
      - name: Generate bundle report
        run: node scripts/generate-bundle-report.cjs
      
      - name: Start preview server
        run: npm run start &
        env:
          CI: true
      
      - name: Wait for server
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:4173; do sleep 2; done'
      
      - name: Run Lighthouse
        run: node scripts/lighthouse-summary.cjs http://localhost:4173
      
      - name: Run Lighthouse HTML report
        run: node scripts/lighthouse-performance.js http://localhost:4173 || true
      
      - name: Upload Lighthouse HTML report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-reports/*.html
          retention-days: 30
      
      - name: Upload bundle sizes
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: |
            BUNDLE_SIZES.md
            LIGHTHOUSE_SUMMARY.md
            dist/stats.html
          retention-days: 30
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lighthouse = fs.readFileSync('LIGHTHOUSE_SUMMARY.md', 'utf8');
            const bundle = fs.readFileSync('BUNDLE_SIZES.md', 'utf8').split('\n').slice(0, 15).join('\n');
            
            const body = `## 📊 Performance Report
            
${lighthouse}
            
<details>
<summary>📦 Top Bundle Sizes</summary>
            
${bundle}
            
</details>
            
[View full Lighthouse report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

