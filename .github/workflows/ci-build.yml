name: CI Build (Vercel Optimized)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install deps (npm)
        run: npm ci

      - name: Build (optimized)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_WARN_THRESHOLD_MS: 120000
        run: npm run build:optimized

      - name: Upload deploy metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-metrics
          path: reports/deploy-metrics.json

  # Optional: Deploy via Vercel CLI (requires secrets)
  # Deploy via GH desativado: Vercel Git fará o deploy automático
  deploy:
    if: false
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy via GH desativado; usar Vercel Git Integration"
