name: 🔍 Deploy Preview

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

# Evitar múltiplos deploys simultâneos para a mesma branch
concurrency:
  group: preview-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: false # Desativado: Vercel Git Integration gerencia previews
    name: Deploy Preview to Vercel
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 🔧 Install dependencies
        run: npm ci
      
      - name: 🔍 Run linting
        run: npm run lint
        continue-on-error: true
      
      - name: 🏗️  Build application
        run: npm run build
        env:
          NODE_ENV: production
          CI: true
      
      - name: 🚀 Deploy Preview to Vercel
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ''  # Preview, não production
          working-directory: ./
      
      - name: 💬 Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🔍 **Preview Deploy** pronto!\\n\\n' +
                    '🔗 URL: ' + '${{ steps.vercel-deploy.outputs.preview-url }}' + '\\n\\n' +
                    '✅ Teste as mudanças antes de fazer merge.'
            })
      
      - name: ✅ Preview deployment successful
        if: success()
        run: |
          echo "🎉 Preview deploy concluído!"
          echo "🔗 URL: ${{ steps.vercel-deploy.outputs.preview-url }}"

