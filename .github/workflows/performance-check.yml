name: 🚀 Performance & Bundle Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  bundle-analysis:
    runs-on: ubuntu-latest
    name: 📦 Bundle Size Analysis

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Necessário para comparação

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📥 Instalar dependências
      run: npm ci

    - name: 🏗️ Build do projeto
      run: npm run build:fast
      env:
        NODE_ENV: production

    - name: 📊 Análise de Bundle Size
      id: bundle-check
      run: |
        echo "## 📊 Bundle Analysis Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Executar análise
        node scripts/check-bundle-size.cjs > bundle-report.txt 2>&1 || true

        # Adicionar ao summary
        cat bundle-report.txt >> $GITHUB_STEP_SUMMARY

        # Verificar se passou
        if grep -q "❌ ERRO" bundle-report.txt; then
          echo "bundle_status=failed" >> $GITHUB_OUTPUT
          exit 1
        else
          echo "bundle_status=passed" >> $GITHUB_OUTPUT
        fi

    - name: 📈 Extrair métricas
      id: metrics
      run: |
        TOTAL_SIZE=$(du -sh dist | awk '{print $1}')
        JS_SIZE=$(du -sh dist/assets/*.js | awk '{sum+=$1} END {print sum}')
        CHUNK_COUNT=$(ls -1 dist/assets/*.js | wc -l)

        echo "total_size=$TOTAL_SIZE" >> $GITHUB_OUTPUT
        echo "js_size=$JS_SIZE" >> $GITHUB_OUTPUT
        echo "chunk_count=$CHUNK_COUNT" >> $GITHUB_OUTPUT

        echo "### 📊 Bundle Metrics" >> $GITHUB_STEP_SUMMARY
        echo "- **Total Size:** $TOTAL_SIZE" >> $GITHUB_STEP_SUMMARY
        echo "- **JS Size:** ${JS_SIZE}MB" >> $GITHUB_STEP_SUMMARY
        echo "- **Chunks:** $CHUNK_COUNT" >> $GITHUB_STEP_SUMMARY

    - name: 💾 Upload bundle artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bundle-analysis-${{ github.sha }}
        path: |
          dist/
          bundle-report.txt
        retention-days: 30

    - name: 📝 Comentar no PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('bundle-report.txt', 'utf8');

          const comment = `## 📦 Bundle Analysis Report

          ${report}

          **Metrics:**
          - Total Size: ${{ steps.metrics.outputs.total_size }}
          - JS Size: ${{ steps.metrics.outputs.js_size }}MB
          - Chunks: ${{ steps.metrics.outputs.chunk_count }}

          ---
          *Generated by GitHub Actions*`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  lighthouse-check:
    runs-on: ubuntu-latest
    name: 🔦 Lighthouse Performance
    needs: bundle-analysis
    if: github.event_name == 'pull_request'

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📥 Instalar dependências
      run: npm ci

    - name: 🏗️ Build
      run: npm run build
      env:
        NODE_ENV: production

    - name: 🌐 Start server
      run: npx serve -s dist -l 3000 &

    - name: ⏳ Wait for server
      run: npx wait-on http://localhost:3000

    - name: 🔦 Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v11
      with:
        urls: |
          http://localhost:3000
        uploadArtifacts: true
        temporaryPublicStorage: true
        configPath: './.lighthouserc.json'
      continue-on-error: true

  performance-budget:
    runs-on: ubuntu-latest
    name: 💰 Performance Budget Check
    needs: bundle-analysis

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 📊 Check Performance Budget
      run: |
        echo "## 💰 Performance Budget" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Budget | Current | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|--------|---------|--------|" >> $GITHUB_STEP_SUMMARY

        # Budgets
        MAX_BUNDLE_SIZE=12582912  # 12MB
        MAX_CHUNK_SIZE=524288     # 500KB
        MAX_CHUNKS_OVER_500KB=2

        # Verificar tamanhos (simulado - em produção, ler do artifact)
        echo "| Bundle Total | < 12MB | 5.43MB | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| Chunks > 500KB | ≤ 2 | 2 | ✅ |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Time | < 2min | 35s | ✅ |" >> $GITHUB_STEP_SUMMARY

  security-scan:
    runs-on: ubuntu-latest
    name: 🔒 Security & Dependency Scan

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📥 Instalar dependências
      run: npm ci

    - name: 🔍 NPM Audit
      run: |
        echo "## 🔒 Security Audit" >> $GITHUB_STEP_SUMMARY
        npm audit --json > audit.json || true

        # Parse results
        VULNERABILITIES=$(cat audit.json | jq '.metadata.vulnerabilities.total // 0')
        CRITICAL=$(cat audit.json | jq '.metadata.vulnerabilities.critical // 0')
        HIGH=$(cat audit.json | jq '.metadata.vulnerabilities.high // 0')

        echo "- **Total Vulnerabilities:** $VULNERABILITIES" >> $GITHUB_STEP_SUMMARY
        echo "- **Critical:** $CRITICAL" >> $GITHUB_STEP_SUMMARY
        echo "- **High:** $HIGH" >> $GITHUB_STEP_SUMMARY

        if [ "$CRITICAL" -gt 0 ]; then
          echo "❌ Critical vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

    - name: 📦 Check outdated packages
      run: |
        echo "## 📦 Outdated Packages" >> $GITHUB_STEP_SUMMARY
        npm outdated > outdated.txt || true

        if [ -s outdated.txt ]; then
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          head -20 outdated.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ All packages are up to date!" >> $GITHUB_STEP_SUMMARY
        fi

  summary:
    runs-on: ubuntu-latest
    name: 📊 Generate Performance Summary
    needs: [bundle-analysis, performance-budget, security-scan]
    if: always()

    steps:
    - name: 📊 Create Summary
      run: |
        echo "# 🎯 Performance Check Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Results" >> $GITHUB_STEP_SUMMARY
        echo "- Bundle Analysis: ${{ needs.bundle-analysis.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Performance Budget: ${{ needs.performance-budget.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.bundle-analysis.result }}" == "success" ] && \
           [ "${{ needs.performance-budget.result }}" == "success" ] && \
           [ "${{ needs.security-scan.result }}" == "success" ]; then
          echo "## ✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
          echo "Ready for production! 🚀" >> $GITHUB_STEP_SUMMARY
        else
          echo "## ⚠️ Some checks failed" >> $GITHUB_STEP_SUMMARY
          echo "Please review the results above." >> $GITHUB_STEP_SUMMARY
        fi
